fusion:
  iou_threshold: 0.10
  center_distance_threshold: 80.0
  camera_detector: synthetic_gt
  camera_score_threshold: 0.0
  camera_bbox_noise_std: 0.0
  random_seed: 7

visualization:
  # raw 用于 calibration debug；最终 perception/fusion demo 推荐 non_ground。
  lidar_points_mode: raw
  max_projected_points: 20000
  point_radius: 1
  # 使用 rectified camera depth 的百分位映射 TURBO 色表，避免极远点压缩颜色对比。
  depth_percentiles: [2.0, 98.0]
  # 离线视频默认展示最终用于 perception/fusion demo 的非地面点。
  video_lidar_points_mode: non_ground
  video_fps: 10.0
