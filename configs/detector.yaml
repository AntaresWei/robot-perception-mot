detector:
  type: gt
  score_threshold: 0.0
  class_ids: [1, 2, 3]
  default_score: 1.0
  noise:
    position_std: [0.20, 0.20, 0.20]
    dimensions_std: [0.10, 0.10, 0.10]
    yaw_std: 0.05
    score_std: 0.02
    random_seed: 7
  real:
    type: mmdet3d_pointpillars
    config: mmdetection3d-1.0/configs/pointpillars/hv_pointpillars_secfpn_6x8_160e_kitti-3d-3class.py
    checkpoint: weights/hv_pointpillars_secfpn_6x8_160e_kitti-3d-3class_20220301_150306-37dc2420.pth
    device: cuda:0
    score_threshold: 0.3
    class_mapping:
      0: 2
      1: 3
      2: 1
  camera:
    type: yolo26_onnx
    # 运行时使用 OpenCV DNN，因此这里必须填写 ONNX；该文件应由下方
    # checkpoint 导出生成，不能直接把 .pt 传给当前适配器。
    model: weights/yolo26s_kitti3class.onnx
    checkpoint: weights/yolo26s_kitti3class.pt
    score_threshold: 0.25
    iou_threshold: 0.45
    input_size: 640
    class_mapping:
      0: 1
      1: 2
      2: 3
