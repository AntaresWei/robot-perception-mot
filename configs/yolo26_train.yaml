# 在 /tmp/robot-perception-mot-yolo26 临时环境中使用的 YOLO26 KITTI 三类训练配置。
model: weights/yolo26s.pt
data: configs/yolo26_kitti.yaml
# 至少训练 70 轮；80 轮为当前完整 KITTI Tracking 数据规模的默认值。
epochs: 80
imgsz: 640
batch: 16
device: 0
workers: 4
patience: 20
seed: 7
project: outputs/training
name: yolo26s_kitti3class
output_weight: weights/yolo26s_kitti3class.pt
