dataset_config: configs/dataset.yaml
tracker_config: configs/tracker.yaml
detector_config: configs/detector.yaml

benchmark:
  start_frame: 0
  end_frame: -1
  # GT/NoisyGT 只用于验证 tracking/association，不代表 detector 性能。
  detector_type: gt
  evaluation_distance_threshold: 2.0
  association_distance: 3.0
  tracker_min_hits: 1
  output_dir: outputs/metrics
  plot: true

pointcloud:
  voxel_size: 0.10
  roi:
    x_min: 0.0
    x_max: 70.0
    y_min: -40.0
    y_max: 40.0
    z_min: -3.0
    z_max: 2.0
  outlier_filter:
    method: statistical
    nb_neighbors: 20
    std_ratio: 2.0
    radius: 0.80
    min_neighbors: 5

ground:
  method: ransac
  distance_threshold: 0.15
  ransac_n: 3
  num_iterations: 100
  random_seed: 0
